version: "3.9"

# CH09 LangChain 최종 연결 — 인프라 구성
# PostgreSQL DB를 로컬 Docker 컨테이너로 실행합니다.
# 사용법: docker-compose up -d

services:
  postgres:
    image: postgres:16
    container_name: connecthr_postgres_ch09
    restart: unless-stopped
    environment:
      POSTGRES_DB: connecthr
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d connecthr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: connecthr_ch09_pgdata
