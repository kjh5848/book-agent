version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: connecthr_ch08
    restart: unless-stopped
    environment:
      POSTGRES_DB: connecthr
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ch08_pgdata:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d connecthr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ch08_pgdata:
    driver: local
