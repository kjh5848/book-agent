<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MCP Q&A 에이전트{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 공통 스타일 -->
    <link rel="stylesheet" href="/static/css/qa.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">

<div class="d-flex" style="min-height: 100vh;">
    <!-- 사이드바 -->
    <nav class="sidebar bg-dark text-white d-flex flex-column" style="width: 240px; min-height: 100vh; position: fixed; top: 0; left: 0; z-index: 100;">
        <div class="sidebar-header p-4 border-bottom border-secondary">
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-cpu me-2 text-info"></i>MCP Q&A
            </h5>
            <small class="text-muted">CH08 에이전트</small>
        </div>
        <ul class="nav flex-column p-3 flex-grow-1">
            <li class="nav-item mb-1">
                <a class="nav-link text-white rounded {% if request.url.path == '/admin/dashboard' %}active bg-primary{% endif %} px-3 py-2"
                   href="/admin/dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item mb-1">
                <a class="nav-link text-white rounded {% if request.url.path == '/admin/qa' %}active bg-primary{% endif %} px-3 py-2"
                   href="/admin/qa">
                    <i class="bi bi-chat-dots me-2"></i>RAG Q&A
                </a>
            </li>
            <li class="nav-item mb-1">
                <a class="nav-link text-white rounded {% if request.url.path == '/admin/agent' %}active bg-primary{% endif %} px-3 py-2"
                   href="/admin/agent">
                    <i class="bi bi-robot me-2"></i>MCP Agent
                </a>
            </li>
        </ul>
        <div class="p-3 border-top border-secondary">
            <small class="text-muted">
                <i class="bi bi-book me-1"></i>RAG 기술 도서 CH08
            </small>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1" style="margin-left: 240px;">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
