{% extends "base.html" %}

{% block title %}RAG Q&A — MCP Q&A 에이전트{% endblock %}

{% block content %}
<div class="p-4 d-flex flex-column" style="height: 100vh;">
    <!-- 페이지 헤더 -->
    <div class="d-flex align-items-center mb-3">
        <i class="bi bi-chat-dots fs-3 text-info me-3"></i>
        <div>
            <h2 class="mb-0 fw-bold">RAG Q&A</h2>
            <small class="text-muted">사내 문서 벡터 검색 기반 질의응답</small>
        </div>
    </div>

    <!-- 채팅 영역 -->
    <div class="card border-0 shadow-sm flex-grow-1 d-flex flex-column" style="overflow: hidden;">
        <!-- 채팅 메시지 목록 -->
        <div class="card-body overflow-auto flex-grow-1 p-4" id="chat-container">
            <!-- 초기 안내 메시지 -->
            <div class="text-center text-muted py-5" id="empty-state">
                <i class="bi bi-chat-dots fs-1 mb-3 d-block text-info opacity-50"></i>
                <h5>사내 문서에 대해 질문하세요</h5>
                <p class="small">취업규칙, 복리후생, 업무 절차 등 사내 규정을 검색합니다.</p>
                <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
                    <button class="btn btn-sm btn-outline-secondary suggestion-btn" onclick="fillQuery(this)">연차 신청은 어떻게 하나요?</button>
                    <button class="btn btn-sm btn-outline-secondary suggestion-btn" onclick="fillQuery(this)">복리후생 제도를 알려주세요</button>
                    <button class="btn btn-sm btn-outline-secondary suggestion-btn" onclick="fillQuery(this)">재택근무 정책이 어떻게 되나요?</button>
                </div>
            </div>
        </div>

        <!-- 입력 영역 -->
        <div class="card-footer bg-white border-top p-3">
            <div class="d-flex gap-2">
                <input
                    type="text"
                    id="query-input"
                    class="form-control"
                    placeholder="사내 규정에 대해 질문하세요..."
                    onkeydown="handleKeyDown(event)"
                    autocomplete="off"
                >
                <button class="btn btn-info text-white px-4" id="send-btn" onclick="sendQuery()">
                    <i class="bi bi-send"></i>
                </button>
            </div>
            <div class="mt-2">
                <small class="text-muted">
                    <i class="bi bi-info-circle me-1"></i>
                    ChromaDB 벡터 검색 + LLM 답변 생성 방식입니다.
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/qa.js"></script>
{% endblock %}
