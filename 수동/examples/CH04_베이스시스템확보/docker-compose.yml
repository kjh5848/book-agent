# =============================================================
# docker-compose.yml
# AI 업무 비서 구축: RAG + MCP 실전 가이드 - 4장 베이스 시스템 확보
#
# 이 파일 하나로 아래 서비스가 자동으로 구동됩니다.
#   1. PostgreSQL 16  — 직원/연차/매출 데이터 저장소 (포트 5432)
#   2. FastAPI CRUD   — REST API 서버              (포트 8000)
#   3. pgAdmin 4      — DB 관리용 웹 UI            (포트 5050, 주석 해제 시 활성화)
#
# 사용법:
#   docker-compose up -d          # 백그라운드 실행
#   docker-compose logs -f        # 로그 확인
#   docker-compose down           # 종료
#   docker-compose down -v        # 종료 + 볼륨 삭제 (데이터 초기화)
# =============================================================

version: "3.9"

services:

  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-rag_db}
      POSTGRES_USER:     ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너 최초 기동 시 init/ 폴더의 .sql 파일을 알파벳 순서로 자동 실행합니다.
      - ./init:/docker-entrypoint-initdb.d:ro
      # 데이터 영속 저장 — 컨테이너 재시작 후에도 데이터가 유지됩니다.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- FastAPI CRUD 서버 ---
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_fastapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-rag_db}
      POSTGRES_USER:     ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 소스 코드를 마운트하여 코드 변경 시 자동으로 반영됩니다.
      - ./app:/app/app

  # --- pgAdmin 4 (선택 사항) ---
  # DB 테이블을 GUI로 확인하고 싶다면 아래 주석(#)을 제거하십시오.
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: rag_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL:    admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
    driver: local
