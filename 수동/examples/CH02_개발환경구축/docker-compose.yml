# docker-compose.yml
# AI 업무 비서 구축: RAG + MCP 실전 가이드 — 2장 개발 환경 구축
#
# 역할: PostgreSQL 16 컨테이너를 로컬에서 구동합니다.
#       Docker Compose를 사용함으로써 직접 설치 없이 격리된 환경에서
#       데이터베이스를 재현성 있게 구동할 수 있습니다.
#
# 사용법:
#   1. 최초 구동: docker-compose up -d
#   2. 종료:      docker-compose down
#   3. 데이터까지 삭제: docker-compose down -v

version: "3.9"

services:
  # --- PostgreSQL 관계형 데이터베이스 ---
  postgres:
    image: postgres:16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # 한국어 데이터 처리를 위한 UTF-8 인코딩 설정
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # 호스트:5432 -> 컨테이너:5432 포트 매핑
      # .env의 POSTGRES_PORT 값으로 변경 가능합니다.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너 재시작 시에도 데이터가 유지되는 영속 볼륨
      - postgres_data:/var/lib/postgresql/data
      # 컨테이너 최초 실행 시 init/ 폴더의 SQL 스크립트를 자동으로 실행합니다.
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # 데이터베이스가 준비 완료 상태인지 주기적으로 확인합니다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-company_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- pgAdmin: 웹 기반 PostgreSQL 관리 도구 (선택사항) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rag_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # 브라우저에서 http://localhost:5050 으로 접속합니다.
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    # pgAdmin이 필요 없으면 이 서비스 블록 전체를 주석 처리하십시오.

volumes:
  # 명명된 볼륨: Docker가 관리하는 영속 저장소
  postgres_data:
    driver: local
